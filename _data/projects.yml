# Funded research projects, in the order shown on the Funded Research page. Add new ones at the top.
# id: a short name with no spaces, used in links.
# themes: ids from themes.yml.
# A project with a sponsor and an awarded date (YEAR-MONTH) is also listed in News.
# logo: the sponsor's logo, a file in images/. It is shown on the right of the card once the file is uploaded.
# Optional fields: period, role, team, links (each with label and url).

- id: quantum-tools
  title: Quantum-Inspired Tools for Smarter Transportation Systems
  sponsor: University of Nebraska-Lincoln
  logo: logo-unl.png
  awarded: 2026-08
  period: Aug 2026 to Jul 2027
  themes: [quantum]
  summary: >-
    Testing whether our quantum-inspired way of describing behavior, first shown for drivers,
    works across transportation problems, from daily commuting choices to whole networks.

- id: pharmaceutical-deserts
  title: "Pharmaceutical Deserts in Rural Nebraska: Building the Foundational Evidence for Autonomous Health Logistics"
  sponsor: University of Nebraska-Lincoln
  logo: logo-unl.png
  awarded: 2026-06
  period: Jun 2026 to May 2027
  themes: [mobility]
  summary: >-
    Building the evidence needed to design autonomous delivery of medicines in rural Nebraska,
    where about 70% of counties are pharmacy deserts. With the UNMC College of Pharmacy.

- id: risk-index
  title: Safety and Mobility Risk Index for Region VII Transportation Networks
  sponsor: U.S. DOT Mid-America Transportation Center (MATC)
  logo: logo-matc.png
  awarded: 2025-12
  themes: [mobility]
  summary: >-
    We are building an index that shows where the road networks of Region VII (Iowa, Kansas, Missouri
    and Nebraska) carry the most safety and mobility risk, so that agencies can see where action matters most.

- id: consensus-agents
  title: Consensus-Seeking Autonomous Agents in Complex Cyber-Physical Transportation Systems
  sponsor: NSF National Artificial Intelligence Research Resource (NAIRR)
  logo: logo-nsf.png
  awarded: 2025-09
  themes: [super-intelligence]
  summary: >-
    Autonomous agents rarely want the same thing. We study how many agents with different goals can come
    to agree on how to behave, and what that agreement means for the system they share.
