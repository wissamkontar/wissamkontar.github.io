{% comment %} One lab member card. Used by the Team page for current members and alumni. {% endcomment %}
{% assign m = include.member %}
<div class="member-card{% unless m.photo %} centered{% endunless %}">
  <div class="member-avatar">{% if m.photo %}<img src="/images/{{ m.photo }}" alt="{{ m.name }} - {{ m.role }}" loading="lazy">{% else %}+{% endif %}</div>
  <div class="member-name">{{ m.name }}</div>
  <div class="member-role">{{ m.role }}</div>
  <div class="member-focus">{{ m.detail }}</div>
  {% if m.link %}<a href="{{ m.link }}" target="_blank" rel="noopener noreferrer" class="member-link">Website →</a>{% endif %}
</div>
